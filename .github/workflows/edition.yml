name: edition (manual fallback)

# The iMac runs the daily edition; this is the way to publish one when it is
# off or away. Manual only - there is deliberately no `schedule:` here, because
# two schedulers racing to push the same edition to main is worse than a gap.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Edition date (YYYY-MM-DD). Blank means today."
        required: false
        default: ""
      skip_fetch:
        description: "Re-use committed snapshots instead of fetching"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      # Unlike the iMac, a runner has no login keychain, so the summaries step
      # authenticates with an API key. Without it there is nothing to fall back
      # to, so fail early and say why rather than half-publishing.
      - name: Check the API key is configured
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set in this repo's secrets."
            echo "The summaries step needs a model. On the iMac that comes from"
            echo "the login keychain; here it has to be a secret."
            exit 1
          fi

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash \
            || npm install -g @anthropic-ai/claude-code
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"

      # The Product Hunt fetcher reads .env, not the environment. This file is
      # git-ignored, and the runner only ever stages content/ and
      # newsletter/data/, so it cannot be committed by accident.
      - name: Write .env from secrets
        env:
          PH_API_KEY: ${{ secrets.PH_API_KEY }}
          PH_API_SECRET: ${{ secrets.PH_API_SECRET }}
          AIBYTES_SLACK_WEBHOOK: ${{ secrets.AIBYTES_SLACK_WEBHOOK }}
        run: |
          umask 077
          {
            [ -n "$PH_API_KEY" ] && echo "PH_API_KEY=$PH_API_KEY"
            [ -n "$PH_API_SECRET" ] && echo "PH_API_SECRET=$PH_API_SECRET"
            [ -n "$AIBYTES_SLACK_WEBHOOK" ] && echo "AIBYTES_SLACK_WEBHOOK=$AIBYTES_SLACK_WEBHOOK"
          } > .env || true

      - name: Publish the edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git config user.name "The Infin8y"
          git config user.email "the.infin8y@gmail.com"
          python3 packages/runner/run.py \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.skip_fetch && '--skip-fetch' || '' }}
