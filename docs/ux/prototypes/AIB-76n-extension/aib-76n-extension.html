<style>/* Authoritative design tokens for the app and all shared components.
   Explicit wrapper themes override the OS default; aliases resolve per wrapper. */
:root {
  --font-display: 'Bricolage Grotesque',system-ui,sans-serif;

  --text-16: 16px;
  --lh-16: 22px;
  --text-20: 20px;
  --lh-20: 26px;
  --text-28: 28px;
  --lh-28: 34px;
  --tracking-heading: -0.02em;
  --tracking-body: -0.01em;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;
  --card-pad: 16px;
  --grid-gap: 12px;
  --section-gap: 0px;
  --radius-card: 10px;
  --radius-chip: 6px;
  --radius-img: 8px;
  --border-w: 1px;

  --img-slot: 40px;
  --img-slot-list: 24px;
  --redesign-rail: 250px;
  --redesign-header: 52px;
  /* What the rail, drawer and toolbar clear: the masthead plus a sticky SaveBanner,
     which sets --redesign-banner on the root while it is mounted. */

  --lang-python: #4B78A8;
  --lang-ts: #4F7CC9;
  --lang-rust: #B06A4A;
  --lang-go: #3D9AAD;

}

:root,[data-theme="light"] {

[data-theme="dark"] {

  --line: #ffffff0d;
  --blue: #dedee3;
  --accent: #45454e;
  --accent-hover: #53535e;
  --accent-active: #3a3a43;
  --accent-fg: #eeeeef;
  --soft: #26262c;
  --hover: #18181c;
  --shadow: #00000066;
  --control-border: #777781;

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #101012;
    --surface: #18181b;
    --ink: #eeeeef;
    --muted: #a1a1aa;
    --line: #ffffff0d;
    --blue: #dedee3;
    --accent: #45454e;
    --accent-hover: #53535e;
    --accent-active: #3a3a43;
    --accent-fg: #eeeeef;
    --soft: #26262c;
    --hover: #18181c;
    --shadow: #00000066;
    --control-border: #777781;
    --hot: #FF7A45;
    --hot-tint: #2A1D18;
    --hot-text: #FF7A45;
    --save: #FFC94D;
    --success: #46c282;
    --success-fg: #0c2417;
    --disabled: #5C6270;
  }
}

:root,[data-theme] {
  --bg: var(--paper);
  --text: var(--ink);
  --text-2: var(--muted);
  --border: var(--line);
  --surface-2: var(--soft);
  --link: var(--blue);
  --focus-ring: var(--blue);

/* Ledger component classes. 1px borders, no shadows at rest, hover = accent border + lift. */
/* — chips — */
/* — buttons — */
.ldg-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:0 14px;border-radius:var(--radius-chip);font-family:var(--font-body);font-size:var(--text-13);font-weight:500;cursor:pointer;transition:background var(--transition),border-color var(--transition),color var(--transition);border:var(--border-w) solid transparent}
.ldg-btn--primary{background:var(--accent);color:var(--accent-fg)}
.ldg-btn--primary:hover{background:var(--accent-hover)}
.ldg-btn--primary:active{background:var(--accent-active)}
.ldg-btn--secondary{background:var(--surface);border-color:var(--border);color:var(--text)}
.ldg-btn--secondary:hover{border-color:var(--link);color:var(--link)}
.ldg-btn--ghost{background:transparent;color:var(--link)}
.ldg-btn--ghost:hover{background:var(--surface-2)}
.ldg-btn:disabled{background:var(--surface-2);border-color:var(--border);color:var(--disabled);cursor:not-allowed}
.ldg-btn--google{background:var(--surface);border-color:var(--border);color:var(--text);font-weight:500}
.ldg-btn--google:hover{border-color:var(--link)}
/* — icon button (view/theme toggles, arrows, dismiss) — */
.ldg-iconbtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:var(--border-w) solid transparent;border-radius:var(--radius-chip);background:transparent;color:var(--text-2);cursor:pointer;transition:background var(--transition),color var(--transition),border-color var(--transition)}
.ldg-iconbtn:hover{background:var(--surface-2);color:var(--text)}
.ldg-iconbtn[aria-pressed="true"]{color:var(--link);background:var(--accent-tint)}
.ldg-iconbtn:disabled{color:var(--disabled);background:transparent;cursor:not-allowed}
/* — input — */
.ldg-input{height:32px;padding:0 10px;background:var(--surface-2);border:var(--border-w) solid var(--border);border-radius:var(--radius-chip);font-family:var(--font-body);font-size:var(--text-13);color:var(--text);transition:border-color var(--transition)}
.ldg-input::placeholder{color:var(--text-2)}
.ldg-input:focus{border-color:var(--link);outline:none}
.ldg-input:focus-visible{outline:var(--focus-w) solid var(--focus-ring);outline-offset:var(--focus-offset)}
/* — card (grid) — */
.ldg-card{position:relative;display:flex;gap:12px;background:var(--surface);border:var(--border-w) solid var(--border);border-radius:var(--radius-card);padding:var(--card-pad);transition:border-color var(--transition),transform var(--transition)}
.ldg-card:hover,.ldg-card:focus-within{border-color:var(--link);transform:var(--lift)}
@media (prefers-reduced-motion:reduce){.ldg-card:hover{transform:none}}
.ldg-card--top::before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:2px;background:var(--hot);border-radius:1px}
.ldg-card__img{width:var(--img-slot);height:var(--img-slot);border-radius:var(--radius-img);flex:none;object-fit:cover;background:var(--surface-2)}
.ldg-card__img--circle{border-radius:50%}
.ldg-card__body{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.ldg-card__srcrow{display:flex;align-items:baseline;gap:8px;font-family:var(--font-mono);font-size:var(--text-12);line-height:var(--lh-12);letter-spacing:var(--tracking-mono);font-feature-settings:var(--mono-features);color:var(--text-2)}
.ldg-card__srcrow a{color:var(--text-2)}
.ldg-card__srcrow a:hover{color:var(--link);text-decoration:none}
.ldg-top-label,.ldg-front-label{color:var(--hot-text);font-weight:700}
.ldg-card__title{font-family:var(--font-body);font-size:var(--text-16);line-height:var(--lh-16);font-weight:600;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ldg-card__title a{color:var(--text);text-decoration:none}
.ldg-card__title a:hover{color:var(--link)}
.ldg-card__summary{font-size:var(--text-14);line-height:var(--lh-14);color:var(--text-2);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ldg-card__meta{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:auto;padding-top:6px}
.ldg-card__star{position:absolute;top:10px;right:10px}
/* — card context menu (⋮ → Open in …) — */
.ldg-menu{position:relative;display:inline-flex;flex:none;align-self:center}
.ldg-menu__btn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:none;background:none;border-radius:4px;color:var(--text-2);cursor:pointer;transition:color var(--transition),background var(--transition)}
.ldg-menu__btn:hover,.ldg-menu__btn[aria-expanded="true"]{color:var(--text);background:var(--surface-2)}
.ldg-menu__panel{position:absolute;right:0;top:calc(100% + 4px);z-index:var(--z-popover);background:var(--surface);border:var(--border-w) solid var(--border);border-radius:var(--radius-chip);padding:4px;display:flex;flex-direction:column;min-width:150px}
.ldg-menu__panel--up{top:auto;bottom:calc(100% + 4px)}
.ldg-menu__item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 6px 4px 10px;border-radius:4px}
.ldg-menu__label{font-family:var(--font-mono);font-size:var(--text-12);letter-spacing:var(--tracking-mono);color:var(--text-2);white-space:nowrap}
.ldg-menu__icons{display:inline-flex;gap:2px}
.ldg-menu__icon{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:4px;color:var(--text);transition:background var(--transition)}
.ldg-menu__icon:hover{background:var(--surface-2)}
.ldg-card__actions{display:inline-flex;align-items:center;gap:8px;flex:none}
/* — signal placement variants — */
.ldg-card__left{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}

.ldg-card--corner .ldg-card__srcrow{padding-right:64px}
/* — tags & signals — */
.ldg-tags{font-family:var(--font-mono);font-size:var(--text-12);letter-spacing:var(--tracking-mono);color:var(--text-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ldg-signals{display:inline-flex;gap:10px;font-family:var(--font-mono);font-size:var(--text-12);letter-spacing:var(--tracking-mono);font-feature-settings:var(--mono-features);color:var(--text-2);white-space:nowrap;flex:none}
.ldg-signals svg{vertical-align:-2px}
.ldg-tags--hash{display:inline-flex;gap:8px;align-items:baseline}
.ldg-taghash{color:var(--link)}
.ldg-tagpills{display:inline-flex;align-items:center;gap:6px;min-width:0;overflow:hidden;font-family:var(--font-mono);font-size:var(--text-12);letter-spacing:var(--tracking-mono);color:var(--text-2)}
.ldg-tagpill{display:inline-flex;align-items:center;padding:2px 8px;border:var(--border-w) solid var(--border);border-radius:999px;background:var(--surface-2);white-space:nowrap}
.ldg-lang{display:inline-flex;align-items:center;gap:5px}
.ldg-lang i{width:8px;height:8px;border-radius:50%;display:inline-block}
/* reduced language palette (open decision #3) */
/* — list row — */
.ldg-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:var(--border-w) solid var(--border);background:var(--surface);transition:background var(--transition)}
.ldg-row:hover{background:var(--surface-2)}
.ldg-row__img{width:var(--img-slot-list);height:var(--img-slot-list);border-radius:6px;flex:none;object-fit:cover}
.ldg-row__img--circle{border-radius:50%}
.ldg-row__main{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.ldg-row__top{display:flex;gap:8px;align-items:baseline;min-width:0}
.ldg-row__title{font-size:var(--text-14);font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none}
.ldg-row__title:hover{color:var(--link)}
.ldg-row__summary{font-size:var(--text-13);color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldg-row__meta{font-family:var(--font-mono);font-size:var(--text-12);letter-spacing:var(--tracking-mono);font-feature-settings:var(--mono-features);color:var(--text-2);white-space:nowrap;flex:none}
/* — save star — */
.ldg-star{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:none;background:transparent;color:var(--text-2);cursor:pointer;border-radius:var(--radius-chip);transition:color var(--transition),background var(--transition)}
.ldg-star:hover{color:var(--text);background:var(--surface-2)}
.ldg-star--saved{color:var(--save)}
.ldg-star--saved:hover{color:var(--save)}
/* — section heading — */
.ldg-section-h{display:flex;align-items:baseline;gap:10px;font-family:var(--font-display);font-size:var(--text-20);line-height:var(--lh-20);font-weight:700;letter-spacing:var(--tracking-heading);color:var(--text);margin:0}
.ldg-section-h .ldg-count{font-family:var(--font-mono);font-size:var(--text-14);font-weight:400;letter-spacing:var(--tracking-mono);font-feature-settings:var(--mono-features);color:var(--text-2)}

.ldg-wordmark{font-family:var(--font-display);font-weight:800;letter-spacing:var(--tracking-heading);color:var(--text);text-decoration:none;display:inline-flex;align-items:baseline;gap:2px}

.ldg-wordmark--full{font-size:var(--text-28);line-height:var(--lh-28)}
.ldg-wordmark--compact{font-size:var(--text-20);line-height:var(--lh-20)}
.ldg-wordmark--icon{width:40px;height:40px;border-radius:var(--radius-img);border:var(--border-w) solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-size:18px;gap:0}
/* — header — */
.ldg-seg{display:inline-flex;border:var(--border-w) solid var(--border);border-radius:var(--radius-chip);overflow:hidden}
.ldg-seg .ldg-iconbtn{border-radius:0;width:30px;height:30px}
.ldg-seg__btn{display:inline-flex;align-items:center;height:30px;padding:0 10px;border:none;background:transparent;font-family:var(--font-body);font-size:var(--text-13);font-weight:500;color:var(--text-2);cursor:pointer;transition:background var(--transition),color var(--transition)}
.ldg-seg__btn:hover{background:var(--surface-2)}
.ldg-seg__btn[aria-pressed="true"]{color:var(--link);background:var(--accent-tint)}

.ldg-seg__btn:focus-visible,.ldg-seg .ldg-iconbtn:focus-visible{outline-offset:calc(-1 * var(--focus-w))}
.ldg-avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:var(--text-12);font-weight:700}
/* — edition bar — */
.ldg-edbar{background:var(--bg);border-bottom:var(--border-w) solid var(--border);font-family:var(--font-mono);font-size:var(--text-13);letter-spacing:var(--tracking-mono);font-feature-settings:var(--mono-features);color:var(--text-2)}
.ldg-edbar__in{max-width:var(--content-max);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;position:relative}

.ldg-edbar__date{display:inline-flex;align-items:center;gap:10px;background:none;border:var(--border-w) solid transparent;border-radius:var(--radius-chip);font:inherit;letter-spacing:inherit;padding:4px 10px;cursor:pointer;color:var(--text);transition:background var(--transition)}
.ldg-edbar__date:hover{background:var(--surface-2)}
.ldg-edbar__date strong{font-weight:700;color:var(--text)}
.ldg-edbar__sep{color:var(--border)}
/* — calendar popover — */
.ldg-cal{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);z-index:var(--z-popover);background:var(--surface);border:var(--border-w) solid var(--border);border-radius:var(--radius-card);padding:6px;min-width:240px}
.ldg-cal__row{display:flex;justify-content:space-between;gap:16px;width:100%;padding:7px 10px;border:none;background:none;border-radius:var(--radius-chip);font-family:var(--font-mono);font-size:var(--text-13);letter-spacing:var(--tracking-mono);font-feature-settings:var(--mono-features);color:var(--text);cursor:pointer;transition:background var(--transition)}
.ldg-cal__row:hover{background:var(--surface-2)}
.ldg-cal__row--current{color:var(--link);font-weight:700}
.ldg-cal__row .ldg-count{color:var(--text-2)}
/* — save banner — */
.ldg-banner{background:var(--surface-2);border-bottom:var(--border-w) solid var(--border);font-size:var(--text-13);color:var(--text-2)}
.ldg-banner__in{position:relative;display:flex;align-items:center;justify-content:center;padding:9px 48px}
.ldg-banner__msg{display:inline-flex;align-items:flex-start;gap:8px;color:var(--text)}

.ldg-banner__in b{color:var(--text);font-weight:500}
.ldg-banner a{font-weight:600}
/* — dialog: a modal panel over a scrim; floats, so it may carry a shadow like the popovers — */
.ldg-dialog__scrim{position:fixed;inset:0;z-index:var(--z-dialog);display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--ink) 35%,transparent);overflow:auto}
.ldg-dialog{position:relative;width:min(420px,100%);display:flex;flex-direction:column;gap:10px;padding:22px;background:var(--surface);color:var(--text);border:var(--border-w) solid var(--control-border);border-radius:12px;box-shadow:0 16px 40px var(--shadow);font-family:var(--font-body);outline:none}

.ldg-dialog__title{margin:0;padding-right:28px;font-family:var(--font-display);font-weight:700;font-size:var(--text-20);line-height:1.25;letter-spacing:var(--tracking-heading);color:var(--text);text-wrap:balance}
.ldg-dialog__close{position:absolute;top:14px;right:14px;width:28px;height:28px}

@media (max-width:480px){.ldg-dialog__actions{flex-direction:column-reverse}.ldg-dialog__actions .ldg-btn{width:100%;height:40px}}
/* — empty / end cards — */
.ldg-endcard{border:var(--border-w) solid var(--border);border-radius:var(--radius-card);background:var(--surface);padding:32px 24px;text-align:left;font-family:var(--font-mono);font-size:var(--text-13);letter-spacing:var(--tracking-mono);color:var(--text-2)}
.ldg-endcard b{color:var(--text);font-weight:500}
.ldg-endcard a{white-space:nowrap}
/* — side nav (full-page layout rail) — */
/* content-box, as everywhere in Ledger: the height excludes the 20px top and bottom padding, hence the 40px. */
/* — footer — */

/* The gist view (AIB-145y): one view for the panel and the page. Tokens only. */
.gist{display:flex;flex-direction:column;gap:20px;min-width:0;font-family:var(--font-body);color:var(--text)}
.gist-head{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.gist-kicker{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0;font-size:var(--text-12);color:var(--text-2)}
.gist-kicker i{font-style:normal}
.gist-badge{background:var(--hot-tint);color:var(--hot-text);border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.gist-depth{border:var(--border-w) solid var(--control-border);border-radius:4px;padding:0 5px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.gist-titlerow{display:flex;align-items:center;gap:10px;min-width:0;align-self:stretch}
.gist-mark{flex:none;width:32px;height:32px;border-radius:8px;object-fit:cover}
.gist-mark--circle{border-radius:50%}
.gist-title{margin:0;min-width:0;font:700 22px/1.2 var(--font-display);letter-spacing:-.5px;text-wrap:balance;overflow-wrap:anywhere}
.gist--page .gist-title{font-size:32px;letter-spacing:-1px}
.gist-btn{height:28px;padding:0 10px;gap:5px;font-size:var(--text-12);text-decoration:none}
.gist-out{flex:none;opacity:.75}
.gist-cta{display:flex;flex-wrap:wrap;gap:8px}
.gist-lede{margin:0;font-size:var(--text-16);line-height:1.55;text-wrap:pretty}

.gist-sec p{margin:0;font-size:var(--text-14);line-height:1.6}
.gist-sec ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:var(--text-14);line-height:1.55}
.gist-sec a{color:var(--link);text-decoration:underline;text-underline-offset:2px}
.gist-tag{display:inline-block;margin-right:7px;padding:0 5px;border-radius:4px;background:var(--surface-2);color:var(--text-2);font-size:11px;font-weight:600;letter-spacing:.03em}
.gist-code{margin:0;padding:10px 12px;border-radius:6px;background:var(--surface-2);overflow-x:auto;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.gist-statshead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.gist-asof{font-size:var(--text-12);color:var(--text-2)}
.gist-statgrid{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.gist-statgrid>div{min-width:0;padding:9px 12px;display:flex;flex-direction:column;gap:2px;border:var(--border-w) solid var(--border);border-radius:var(--radius-chip)}
.gist-statgrid dt{font-size:11px;color:var(--text-2)}
.gist-statgrid dd{margin:0;overflow-wrap:anywhere;font-family:var(--font-mono);font-size:15px;font-weight:600;letter-spacing:var(--tracking-mono);font-feature-settings:var(--mono-features)}
.gist-post{margin:0;display:flex;flex-direction:column;gap:10px;padding:16px;border:var(--border-w) solid var(--control-border);border-radius:var(--radius-card)}
.gist-post figcaption{display:flex;flex-direction:column;font-size:var(--text-14)}
.gist-post figcaption span{font-size:var(--text-12);color:var(--text-2)}
.gist-post blockquote{margin:0;font-size:var(--text-16);line-height:1.5;text-wrap:pretty}
.gist-seen i{font-style:normal;color:var(--text-2)}

/* The gist panel (AIB-145y): beside the feed, a full-screen sheet on a phone. */
.gist-panel{position:fixed;top:var(--redesign-top);right:0;bottom:0;max-width:100vw;display:flex;flex-direction:column;background:var(--surface);border-left:var(--border-w) solid var(--control-border);color:var(--text);z-index:60;outline:none;padding-right:env(safe-area-inset-right,0px)}
.gist-resize{position:absolute;left:-3px;top:0;bottom:0;width:6px;cursor:col-resize;z-index:1;touch-action:none}
.gist-resize:hover{background:var(--control-border)}
.gist-resize:focus-visible{outline:var(--focus-w) solid var(--focus-ring);outline-offset:-2px}
body.gist-resizing{cursor:col-resize;user-select:none}
.gist-panel-bar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 20px;border-bottom:var(--border-w) solid var(--line)}
.gist-url{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--text-12);color:var(--text-2);text-decoration:none}
.gist-url:hover{color:var(--link)}
.gist-url .gist-out{margin-left:5px}
.gist-panel-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
.gist--panel{flex:1;padding:20px 20px 28px}
@media (max-width:760px){
  .gist-panel,.gist-panel--sheet{top:0;width:100vw!important;border-left:0;z-index:var(--z-popover);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .gist--panel{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
}

/* Reactions and the saved line under a gist (AIB-145y). */
.gist-reacts{display:flex;flex-wrap:wrap;gap:4px}
.gist-react{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:32px;min-width:36px;padding:0 8px;border:var(--border-w) solid transparent;border-radius:999px;background:none;color:var(--text-2);font:500 var(--text-12) var(--font-mono);letter-spacing:var(--tracking-mono);font-feature-settings:var(--mono-features);cursor:pointer;transition:background var(--transition),border-color var(--transition)}
.gist-react span{font-size:15px;line-height:1}
.gist-react:hover{background:var(--surface-2)}
.gist-react:has(b){border-color:var(--line);background:var(--surface-2)}
.gist-react[aria-pressed="true"]{border-color:var(--link);color:var(--text)}
.gist-react b{font-weight:600}
.gist-saved{margin:0;font-size:var(--text-13);color:var(--text-2)}
.gist-saved a{color:var(--link);text-decoration:underline;text-underline-offset:2px}

/* The save control and reactions row that goes in a gist's `actions` slot. */
.gist-actions{display:flex;flex-direction:column;gap:8px;align-self:stretch}
.gist-actions-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.gist-save{display:inline-flex;align-items:center;height:32px;padding:0 12px 0 4px;border:var(--border-w) solid var(--control-border);border-radius:999px}
.gist-save--on .ldg-star{color:var(--save)}
.gist-save-label{padding:0;border:0;background:none;color:var(--text);font:500 var(--text-13) var(--font-body);cursor:pointer}
.gist-linkbtn{padding:0;border:0;background:none;color:var(--link);font:inherit;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.gist-react-note{margin:0;color:var(--text-2);font:400 var(--text-12) var(--font-body)}

/* Shared app presentation and base accessibility rules. */


/* Ledger base — minimal defaults consumers can drop into Astro. */
a:hover {
  color: var(--link);
  text-decoration: underline;
}

:focus-visible {
  outline: var(--focus-w) solid var(--focus-ring);
  outline-offset: var(--focus-offset);

/* Links in running text show at rest, by colour and underline (WCAG 1.4.1):
   a paragraph in the app's main column, or anything under .ldg-prose. Nav,
   card, row and button links keep the base rule above. */
.app-main p a,
.ldg-prose a {
  color: var(--link);
  text-decoration-line: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.app-main p a:hover,
.ldg-prose a:hover {

}

/* List rows lay out by their own width, not the window's, so a row looks the
   same in the app and in a narrow design frame. From 560px a row has room for
   a right-hand column: the source on the title line with the menu beside it,
   and its counts right under it on the summary line. Narrower rows keep the
   phone layout, with source and counts on a third line. Type sizes still
   follow the window. */

.story:not(.story--grid) {
  container: ldg-row / inline-size;
}

@container ldg-row (min-width: 560px) {
  .story:not(.story--grid) .story-content {
    display: grid;
    grid-template-columns: minmax(0,1fr) max-content;
    column-gap: 24px;
  }
  .story:not(.story--grid) .story-content .story-top {
    grid-column: 1;
    grid-row: 1;
    order: 0;
  }
  .story:not(.story--grid) .story-content .summary {
    grid-column: 1;
    grid-row: 2;
    width: 100%;
    max-width: none;
    order: 0;
  }
  .story:not(.story--grid) .story-content .metadata {
    display: grid;
    grid-template-columns: auto auto;
    grid-column: 2;
    grid-row: 1 / 3;
    gap: 0 9px;
    order: 0;
    align-self: start;
    justify-self: end;
    justify-items: end;
    align-items: center;
    justify-content: flex-end;
    width: max-content;
    max-width: none;
    flex-wrap: nowrap;
    white-space: nowrap;
    line-height: 24px;
  }
  .story:not(.story--grid) .story-content .metadata .discussion {
    grid-column: 1;
    grid-row: 1;
    flex-basis: auto;
    text-align: initial;
  }
  .story:not(.story--grid) .story-content .metadata .ldg-signals {
    grid-column: 1;
    grid-row: 2;
    line-height: 1.5;
  }
  .story:not(.story--grid) .story-content .metadata .item-actions {
    grid-column: 2;
    grid-row: 1;
  }
}

/* The newsletter prompt inside Ledger's Dialog (AIB-140p). */
.prompt-signed { display: flex; align-items: flex-start; gap: 10px; }
.prompt-tick { width: 22px; height: 22px; flex: none; margin-top: 1px; }
.prompt-tick circle { fill: var(--success); }
.prompt-tick path { stroke: var(--success-fg); }
.ldg-dialog .prompt-lead { color: var(--text); font-weight: 500; margin-top: 6px; }
.prompt-covers { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, max-content); justify-content: space-between; gap: 8px 24px; max-width: 100%; font-size: 13px; line-height: 1.4; color: var(--text-2); }
.prompt-covers li { display: flex; gap: 8px; min-width: 0; }
.prompt-covers li::before { content: ""; flex: none; width: 5px; height: 5px; margin-top: 7px; border-radius: 50%; background: var(--link); }
.ldg-dialog .prompt-proof { font-size: 12px; text-align: center; text-wrap: balance; }
.prompt-builtby { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; margin: 6px 0 0; padding-top: 12px; border-top: 1px solid var(--control-border); font-size: 12px; color: var(--text-2); }
.prompt-builtby span { color: var(--text); }
.prompt-builtby svg { width: 13px; height: 13px; }
.prompt-yc { width: 16px; height: 16px; }
.prompt-yc rect { fill: var(--hot); }
.prompt-yc path { stroke: #fff; }
.prompt-thanks { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 14px 0 4px; }
.prompt-thanks .ldg-dialog__title { padding: 0; }
.prompt-thanks .prompt-tick { width: 48px; height: 48px; margin-top: 0; }
.prompt-thanks b { color: var(--text); font-weight: 500; overflow-wrap: anywhere; }
.prompt-closing { text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; }
.prompt-closing b { font-weight: 600; }

/* The gist panel beside the feed (AIB-145y): the panel publishes its width as
   --gist-panel-w, and the feed gives that room up. Not on a phone, where the
   panel is a full-screen sheet. */
@media (min-width: 761px) {
  .redesign .redesign-main { padding-right: var(--gist-panel-w, 0px); }
}

/* The gist page: the header only and one centred reading column of 720px, with
   the same gutter on both sides (20px on a phone). */
