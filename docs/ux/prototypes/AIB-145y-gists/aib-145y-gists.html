.redesign .redesign-main:focus {
  outline: none;
}

.ldg-menu__panel {
  background: var(--surface);
  border-color: var(--control-border);
  width: 150px;
  padding: 8px;
  border-radius: 7px;
  box-shadow: 0 10px 30px #0004;
}

/* The header's account controls: Sign in while signed out, then the avatar
   (Google photo or initial) and its menu, which reuses the card menu's panel. */
.masthead .signin {
  height: 32px;
  padding: 0 12px;
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
}

.account {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: none;
  cursor: pointer;
}

.account__photo,
.account__initial {
  width: 30px;
  height: 30px;
  border: 1px solid var(--border);
  border-radius: 50%;
  box-sizing: border-box;
}

.account__photo {
  object-fit: cover;
}

.account__initial {
  display: grid;
  place-items: center;
  background: var(--surface-2);
  color: var(--text);
  font: 600 13px Inter, system-ui, sans-serif;
}

.account__panel {
  top: calc(100% + 8px);
  width: auto;
  min-width: 200px;
  max-width: min(280px, calc(100vw - 32px));
}

.account__who {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 4px 8px 10px;
  margin-bottom: 4px;
  border-bottom: 1px solid var(--border);
}

.account__name {
  overflow: hidden;
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.account__via {
  color: var(--text-2);
  font-size: 12px;
}

.account__item {
  padding: 8px;
  border: 0;
  border-radius: 4px;
  background: none;
  color: var(--text);
  font: 500 14px Inter, system-ui, sans-serif;
  text-align: left;
  cursor: pointer;
}

.account__item:hover {
  background: var(--surface-2);
}

.ldg-menu__item {
  display: block;
  padding: 0;
}

.ldg-menu__label {
  display: block;
  padding: 4px 7px 7px;
  font-size: 12px;
  color: var(--muted);
}

.ldg-menu__icons {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 0;
}

.ldg-menu__icon {
  display: flex;
  justify-content: flex-start;
  gap: 8px;
  width: auto;
  height: auto;
  padding: 7px;
  border-radius: 4px;
  color: var(--ink);
  font-size: 12px;
  text-decoration: none;
}

.ldg-menu__icon:hover {
  background: var(--soft);
}

.ldg-menu__icon svg {
  display: none;
}

.app-shell {
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

.app-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.app-skip {
  position: absolute;
  left: 12px;
  top: -100px;
  z-index: var(--z-popover);
  padding: 8px 12px;
  background: var(--accent);
  color: var(--accent-fg);
  border-radius: var(--radius-chip);
  font-size: var(--text-13);
  font-weight: 600;
  text-decoration: none;
}

.app-skip:focus {
  top: 12px;
}

.app-main:focus {
  outline: none;
}

.app-pop {
  position: absolute;
  right: max(20px,calc((100% - var(--content-max))/2 + 20px));
  top: calc(100% + 6px);
  z-index: var(--z-popover);
  background: var(--surface);
  border: var(--border-w) solid var(--border);
  border-radius: var(--radius-card);
  padding: 14px;
  width: 540px;
  max-width: calc(100vw - 40px);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.app-pop__label {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-2);
  letter-spacing: .04em;
  text-transform: uppercase;
}

.app-pop__chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

html:not([data-input-modality="keyboard"]) .app-shell :focus,.app-shell :focus:not(:focus-visible) {
  outline: none;
}

.ldg-edbar__nav {
  font-size: 13px;
  color: var(--muted);
  width: 28px;
  height: 32px;
  padding: 6px;
  justify-content: center;
}

.ldg-edbar__date::after {
  margin-left: 8px;
  content: none;
}

.ldg-edbar__icon {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

.ldg-edbar__date .ldg-edbar__icon {
  width: 14px;
  height: 14px;
  color: var(--muted);
}

/* Shared card options: source position is used by the daily feed; the other
   placements remain available to reusable components and UI-kit controls. */
.story-visual {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

/* starPos="visual": the save star sits under the source image, sized to the
   image column (26-30px wide), so it never widens the row. */
.story-visual .ldg-star {
  width: 28px;
  max-width: 100%;
  height: 28px;
}

.story-visual .ldg-star svg {
  width: 16px;
  height: 16px;
}

.story-tags {
  grid-column: 1;
  min-width: 0;
  font-size: 12px;
  color: var(--muted);
}

.story--grid .story-tags {
  order: 2;
  white-space: normal;
  overflow: visible;
}

.story--grid .story-signals {
  order: 2;
}

.story--signals-logo, .story--signals-bottom {
  grid-template-columns: 44px minmax(0,1fr);
}

.story--signals-bottom .story-visual .ldg-signals {
  margin-top: auto;
}

.story-visual .ldg-signals {
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 11px;
}

.story--signals-bottom .story-visual {
  height: 100%;
}

.story-tags.ldg-tagpills, .story-tags.ldg-tags--hash {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

/* List rows lay out by their own width, not the window's, so a row looks the
   same in the app and in a narrow design frame. From 560px a row has room for
   a right-hand column: the source on the title line with the menu beside it,
   and its counts right under it on the summary line. Narrower rows keep the
   phone layout, with source and counts on a third line. Type sizes still
   follow the window. */

.story:not(.story--grid) {
  container: ldg-row / inline-size;
}

@container ldg-row (min-width: 560px) {
  .story:not(.story--grid) .story-content {
    display: grid;
    grid-template-columns: minmax(0,1fr) max-content;
    column-gap: 24px;
  }
  .story:not(.story--grid) .story-content .story-top {
    grid-column: 1;
    grid-row: 1;
    order: 0;
  }
  .story:not(.story--grid) .story-content .summary {
    grid-column: 1;
    grid-row: 2;
    width: 100%;
    max-width: none;
    order: 0;
  }
  .story:not(.story--grid) .story-content .metadata {
    display: grid;
    grid-template-columns: auto auto;
    grid-column: 2;
    grid-row: 1 / 3;
    gap: 0 9px;
    order: 0;
    align-self: start;
    justify-self: end;
    justify-items: end;
    align-items: center;
    justify-content: flex-end;
    width: max-content;
    max-width: none;
    flex-wrap: nowrap;
    white-space: nowrap;
    line-height: 24px;
  }
  .story:not(.story--grid) .story-content .metadata .discussion {
    grid-column: 1;
    grid-row: 1;
    flex-basis: auto;
    text-align: initial;
  }
  .story:not(.story--grid) .story-content .metadata .ldg-signals {
    grid-column: 1;
    grid-row: 2;
    line-height: 1.5;
  }
  .story:not(.story--grid) .story-content .metadata .item-actions {
    grid-column: 2;
    grid-row: 1;
  }
}

/* — weekly (AIB-105j): the /weekly archive and the issue page's subscribe bar — */
.weekly-archive {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding: var(--space-8) var(--gutter-mobile) var(--space-12);
}

.weekly-archive__head {
  margin-bottom: var(--space-6);
}

.weekly-archive__kicker {
  margin: 0 0 var(--space-2);
  color: var(--muted);
  font-size: var(--text-12);
  line-height: var(--lh-12);
  font-weight: 600;
  letter-spacing: var(--tracking-mono);
  text-transform: uppercase;
}

.weekly-archive__title {
  margin: 0 0 var(--space-2);
  font-family: var(--font-display);
  font-size: var(--text-28);
  line-height: var(--lh-28);
  font-weight: 800;
  letter-spacing: var(--tracking-heading);
}

.weekly-archive__lede {
  margin: 0;
  color: var(--muted);
  font-size: var(--text-14);
  line-height: var(--lh-14);
}

.weekly-list {
  list-style: none;
  margin: 0;
  padding: 0;
  border-top: 1px solid var(--line);
}

.weekly-issue {
  display: grid;
  gap: var(--space-1);
  padding: var(--space-4) var(--space-2);
  border-bottom: 1px solid var(--line);
  color: inherit;
  text-decoration: none;
  transition: background var(--transition);
}

.weekly-issue:hover {
  background: var(--hover);
}

.weekly-issue__meta {
  display: flex;
  justify-content: space-between;
  gap: var(--space-3);
  color: var(--muted);
  font-size: var(--text-12);
  line-height: var(--lh-12);
  font-feature-settings: var(--mono-features);
}

.weekly-issue__title {
  font-size: var(--text-16);
  line-height: var(--lh-16);
  font-weight: 600;
  letter-spacing: var(--tracking-body);
}

.weekly-issue:hover .weekly-issue__title {
  color: var(--link);
}

.weekly-issue__desc {
  color: var(--muted);
  font-size: var(--text-14);
  line-height: var(--lh-14);
}

.weekly-subscribe {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin: var(--space-3) 0 var(--space-2);
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  background: var(--surface);
}

.weekly-subscribe__text {
  margin: 0;
  color: var(--muted);
  font-size: var(--text-13);
  line-height: var(--lh-13);
}

.weekly-subscribe__text b {
  color: var(--ink);
  font-weight: 600;
}

.weekly-subscribe__action {
  flex: none;
  text-decoration: none;
}

@media (max-width:760px) {
  .weekly-subscribe {
    flex-direction: column;
    align-items: stretch;
  }
}

/* The newsletter prompt inside Ledger's Dialog (AIB-140p). */
.prompt-signed { display: flex; align-items: flex-start; gap: 10px; }
.prompt-tick { width: 22px; height: 22px; flex: none; margin-top: 1px; }
.prompt-tick circle { fill: var(--success); }
.prompt-tick path { stroke: var(--success-fg); }
.ldg-dialog .prompt-lead { color: var(--text); font-weight: 500; margin-top: 6px; }
.prompt-covers { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, max-content); justify-content: space-between; gap: 8px 24px; max-width: 100%; font-size: 13px; line-height: 1.4; color: var(--text-2); }
.prompt-covers li { display: flex; gap: 8px; min-width: 0; }
.prompt-covers li::before { content: ""; flex: none; width: 5px; height: 5px; margin-top: 7px; border-radius: 50%; background: var(--link); }
.ldg-dialog .prompt-proof { font-size: 12px; text-align: center; text-wrap: balance; }
.prompt-builtby { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; margin: 6px 0 0; padding-top: 12px; border-top: 1px solid var(--control-border); font-size: 12px; color: var(--text-2); }
.prompt-builtby span { color: var(--text); }
.prompt-builtby svg { width: 13px; height: 13px; }
.prompt-yc { width: 16px; height: 16px; }
.prompt-yc rect { fill: var(--hot); }
.prompt-yc path { stroke: #fff; }
.prompt-thanks { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 14px 0 4px; }
.prompt-thanks .ldg-dialog__title { padding: 0; }
.prompt-thanks .prompt-tick { width: 48px; height: 48px; margin-top: 0; }
.prompt-thanks b { color: var(--text); font-weight: 500; overflow-wrap: anywhere; }
.prompt-closing { text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; }
.prompt-closing b { font-weight: 600; }

/* Prototype-only styles for AIB-145y. Every color is a Ledger token, except the
   newsletter stand-in, which is deliberately not Ledger. */
body { background: var(--bg); color: var(--text); }
:root { --gist-w: 460px; --mail-bg: #ffffff; --mail-ink: #14161a; --mail-dim: #5b6472; --mail-link: #d9480f; --mail-line: #e4e6ea; }

.proto-out { font-size: .85em; }
.proto-x { width: 28px; height: 28px; display: grid; place-items: center; border: 0; background: none; color: var(--text-2); border-radius: 5px; cursor: pointer; flex: none; }
.proto-x:hover { background: var(--surface-2); color: var(--text); }

/* The card is a link to its gist */
.proto-cardwrap { display: contents; cursor: pointer; }
.proto-cardwrap--open > .story { border-color: var(--link); box-shadow: inset 3px 0 0 var(--link); }

/* A1: the feed makes room for the panel */
@media (min-width: 761px) {
  .redesign.proto-beside .workspace { width: calc(100% - 300px - var(--gist-w)); margin-left: 280px; margin-right: calc(var(--gist-w) + 20px); }
}

/* The panel */
.gist-scrim { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 35%, transparent); z-index: 240; }
.gist-panel { position: fixed; top: var(--redesign-top); right: 0; bottom: 0; width: var(--gist-w); max-width: 100vw; background: var(--surface); border-left: 1px solid var(--control-border); display: flex; flex-direction: column; z-index: 60; font-family: var(--font-body); outline: none; padding-right: env(safe-area-inset-right, 0px); }
.gist-panel--over { top: 0; width: min(560px, 100vw); z-index: 250; box-shadow: -16px 0 40px var(--shadow); }
.gist-panel-bar { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 20px; border-bottom: 1px solid var(--line); flex: none; }
.gist-url { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.gist-url:hover { color: var(--link); }
.gist-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; }
.gist--panel { padding: 20px 20px 28px; flex: 1; }
@media (max-width: 760px) {
  .gist-panel, .gist-panel--over { top: 0; width: 100vw; border-left: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .gist--panel { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
}

/* The gist: one view for the panel and the page */
.gist { display: flex; flex-direction: column; gap: 20px; min-width: 0; font-family: var(--font-body); color: var(--text); }
.gist-head { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.gist-kicker { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.gist-kicker i { font-style: normal; }
.gist-kicker .source-icon { width: 20px; height: 20px; border-radius: 5px; }
/* Badges: Top today and HN front page, in the family of Ledger's TOP label */
.gist-badge, .proto-cardwrap--front .metadata::before { color: var(--hot-text); font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.gist-badge { background: var(--hot-tint); border-radius: 4px; padding: 1px 6px; }
.proto-cardwrap--front .metadata::before { content: "Front page"; }
.gist-depth { border: 1px solid var(--control-border); border-radius: 4px; padding: 0 5px; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.gist-title { margin: 0; font: 700 22px/1.2 var(--font-display); letter-spacing: -.5px; text-wrap: balance; overflow-wrap: anywhere; }
.gist--page .gist-title { font-size: 32px; letter-spacing: -1px; }
.gist-source { height: 34px; gap: 6px; text-decoration: none; }
.gist-lede { margin: 0; font-size: 16px; line-height: 1.55; color: var(--text); text-wrap: pretty; }
.gist--page .gist-lede { font-size: 18px; }
.gist-briefnote { margin: -8px 0 0; font-size: 13px; color: var(--text-2); }
.gist-sec { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.gist-sec h3 { margin: 0; font: 600 12px var(--font-body); letter-spacing: .07em; text-transform: uppercase; color: var(--text-2); }
.gist-sec p { margin: 0; font-size: 14px; line-height: 1.6; }
.gist-sec ul, .gist-sec ol { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.55; }
.gist-tag { display: inline-block; margin-right: 7px; font-size: 11px; font-weight: 600; letter-spacing: .03em; color: var(--text-2); background: var(--surface-2); border-radius: 4px; padding: 0 5px; }
.gist-code { margin: 0; padding: 10px 12px; background: var(--surface-2); border-radius: 6px; overflow-x: auto; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }

.gist-stats { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.gist-asof { margin: 0; font-size: 11px; line-height: 1.4; color: var(--text-2); font-variant-numeric: tabular-nums; }
.gist-statline { margin: 0; font-size: 13px; line-height: 1.6; color: var(--text-2); font-variant-numeric: tabular-nums; }
.gist-statline b { color: var(--text); font-weight: 600; }
.gist-statline i { font-style: normal; }
.gist-statgrid { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 1px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.gist-statgrid > div { box-shadow: 0 0 0 1px var(--line); padding: 9px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.gist-statgrid dt { font-size: 11px; color: var(--text-2); }
.gist-statgrid dd { margin: 0; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

.gist-refs a, .gist-seen a, .proto-crumb a, .proto-sub a { color: var(--link); text-decoration: underline; text-underline-offset: 2px; }
.gist-refs li span { margin-left: 8px; font-size: 12px; color: var(--text-2); }
.gist-seen i { font-style: normal; color: var(--text-2); }

/* The X post preview */
.gist-post { margin: 0; border: 1px solid var(--control-border); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.gist-post figcaption { display: flex; flex-direction: column; font-size: 14px; }
.gist-post figcaption span { font-size: 12px; color: var(--text-2); }
.gist-post blockquote { margin: 0; font-size: 16px; line-height: 1.5; text-wrap: pretty; }

/* Star and reactions */
.gist-actions { display: flex; flex-direction: column; gap: 8px; align-self: stretch; }
.gist-actions-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.gist-save { display: inline-flex; align-items: center; border: 1px solid var(--control-border); border-radius: 999px; padding: 0 12px 0 4px; height: 32px; }
.gist-save--on .ldg-star { color: var(--save); }
.gist-save-label { border: 0; background: none; color: var(--text); font: 500 13px var(--font-body); cursor: pointer; padding: 0; }
.gist-reacts { display: flex; flex-wrap: wrap; gap: 4px; }
.gist-react { display: inline-flex; align-items: center; gap: 5px; height: 32px; min-width: 36px; justify-content: center; padding: 0 8px; border: 1px solid transparent; border-radius: 999px; background: none; color: var(--text-2); font: 500 12px var(--font-body); font-variant-numeric: tabular-nums; cursor: pointer; }
.gist-react span { font-size: 15px; line-height: 1; }
.gist-react:hover { background: var(--surface-2); }
.gist-react:has(b) { border-color: var(--line); background: var(--surface-2); }
.gist-react[aria-pressed="true"] { border-color: var(--link); color: var(--text); }
.gist-saved { margin: 0; font-size: 13px; color: var(--text-2); }
.gist-saved a { color: var(--link); text-decoration: underline; text-underline-offset: 2px; }
.gist-ask { margin: 0; font-size: 13px; color: var(--text-2); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.gist-linkbtn { border: 0; background: none; padding: 0; color: var(--link); font: 600 13px var(--font-body); text-decoration: underline; cursor: pointer; }
.gist-actions--pinned { position: sticky; bottom: 0; margin: auto -20px -28px; padding: 10px 20px; background: var(--surface); border-top: 1px solid var(--line); }
.gist--page .gist-actions--pinned { margin: 8px 0 0; padding: 10px 0; background: var(--bg); }

/* The gist page */
/* One reading column, 720px of text at most, with the same gutter on both sides
   at every width. In the app shell it starts where the feed starts; as a
   reading page it is centred. */
.proto-page, .mail-wrap { --page-gutter: 0px; box-sizing: border-box; width: 100%; max-width: calc(720px + 2 * var(--page-gutter)); padding-inline: max(var(--page-gutter), env(safe-area-inset-left, 0px)) max(var(--page-gutter), env(safe-area-inset-right, 0px)); }
.proto-page { display: flex; flex-direction: column; gap: 24px; padding-block: 12px 96px; }
