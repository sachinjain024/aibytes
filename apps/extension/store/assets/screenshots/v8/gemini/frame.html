<!doctype html>
<html lang="en" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<style>
  :root {
    --cream: #f6efe2;
    --cream-2: #ece2cf;
    --dots: #d5c6ab;
    --navy: #1a1a2e;
    --ink-2: #4a4a60;
    --orange: #ff7a00;
    --blue: #3b82f6;
    --purple: #8b5cf6;
    --teal: #10a37f;
    --yellow: #ffc83d;
    --pink: #ff8fb1;
    --sky: #8ec5ff;
    --white: #ffffff;

    --pop-left: 648px;
    --pop-top: 109px;
    --pop-scale: 1;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 1280px;
    height: 800px;
    overflow: hidden;
    background: var(--cream);
    color: var(--navy);
  }

  body {
    position: relative;
    font-family: 'Inter', system-ui, sans-serif;
  }

  /* Soft dotted ground band along the bottom (matches reference r1). */
  .ground {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 120px;
    background-color: var(--cream-2);
    background-image: radial-gradient(var(--dots) 1.4px, transparent 1.7px);
    background-size: 12px 12px;
    border-top: 2px solid rgba(26, 26, 46, 0.06);
  }

  .confetti {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  /* Left column: brand, headline, subtitle, and playful swoosh. */
  .copy {
    position: absolute;
    left: 72px;
    top: 0;
    bottom: 120px;
    width: 460px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 20px;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    font: 700 22px/1 'Bricolage Grotesque', system-ui, sans-serif;
    letter-spacing: -0.01em;
    color: var(--navy);
  }

  .brand img {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    border: 2px solid var(--navy);
  }

  .brand b {
    color: var(--blue);
  }

  h1 {
    margin: 0;
    font: 800 56px/1.04 'Bricolage Grotesque', system-ui, sans-serif;
    letter-spacing: -0.03em;
    color: var(--navy);
  }

  h1 em {
    font-style: normal;
    color: var(--orange);
  }

  .sub {
    margin: 0;
    font: 500 22px/1.38 'Bricolage Grotesque', system-ui, sans-serif;
    color: var(--ink-2);
  }

  .swoosh {
    display: block;
    width: 280px;
    height: 26px;
    margin-top: 2px;
  }

  /* Right column: the real popup capture, whole and uncropped. */
  .pop {
    position: absolute;
    left: var(--pop-left);
    top: var(--pop-top);
    border: 3px solid var(--navy);
    border-radius: 20px;
    overflow: hidden;
    background: var(--white);
    box-shadow: 8px 10px 0 rgba(26, 26, 46, 0.14), 0 26px 56px -20px rgba(26, 26, 46, 0.34);
  }

  .pop img {
    display: block;
    width: calc({{SHOT1_W}}px * var(--pop-scale));
    height: calc({{SHOT1_H}}px * var(--pop-scale));
  }

  .doodle {
    position: absolute;
    pointer-events: none;
  }

  .only { display: none; }
  [data-layout="sources"] .only-sources,
  [data-layout="single"] .only-single,
  [data-layout="annotated"] .only-annotated,
  [data-layout="art"] .only-art {
    display: block;
  }

  [data-layout="art"] .pop {
    display: none;
  }

  /* S1 (sources): four source chips feeding into the popup. */
  [data-layout="sources"] {
    --pop-left: 716px;
    --pop-top: 138px;
    --pop-scale: 0.9;
  }

  [data-layout="sources"] .copy {
    width: 420px;
  }

  [data-layout="sources"] h1 {
    font-size: 52px;
  }

  .src {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px 10px 10px;
    background: var(--white);
    border: 2.5px solid var(--navy);
    border-radius: 14px;
    font: 700 17px/1 'Bricolage Grotesque', system-ui, sans-serif;
    color: var(--navy);
    box-shadow: 4px 4px 0 var(--navy);
    white-space: nowrap;
  }

  .src img {
    width: 28px;
    height: 28px;
    border-radius: 7px;
  }

  /* S4 (annotated): popup shifted slightly left so callout tags sit cleanly to its right. */
  [data-layout="annotated"] {
    --pop-left: 482px;
    --pop-top: 109px;
    --pop-scale: 1;
  }

  [data-layout="annotated"] .copy {
    left: 64px;
    width: 376px;
  }

  [data-layout="annotated"] h1 {
    font-size: 48px;
  }

  [data-layout="annotated"] .sub {
    font-size: 20px;
  }

  .ring {
    position: absolute;
    border: 3.5px solid var(--c);
    border-radius: 12px;
    left: calc(var(--pop-left) + 3px + var(--x) + 6px);
    top: calc(var(--pop-top) + 3px + var(--y) + 4px);
    width: calc(var(--w) - 12px);
    height: calc(var(--h) - 8px);
    pointer-events: none;
  }

  .leader {
    position: absolute;
    left: calc(var(--pop-left) + 3px + var(--x) + var(--w) - 6px);
    top: calc(var(--pop-top) + 3px + var(--y) + var(--h) / 2 - 2px);
    width: 26px;
    height: 4px;
    background: var(--c);
    border-radius: 2px;
  }

  .tag {
    position: absolute;
    left: calc(var(--pop-left) + 3px + var(--x) + var(--w) + 18px);
    top: calc(var(--pop-top) + 3px + var(--y) + var(--h) / 2 - 21px);
    padding: 9px 15px;
    border-radius: 12px;
    border: 2.5px solid var(--navy);
    background: var(--c);
    color: var(--white);
    font: 700 17px/1.2 'Bricolage Grotesque', system-ui, sans-serif;
    white-space: nowrap;
    box-shadow: 4px 4px 0 var(--navy);
    transform: rotate(var(--r));
  }

  .hn {
    --c: var(--orange);
    --r: -2deg;
    --x: var(--row-hacker-news-x);
    --y: var(--row-hacker-news-y);
    --w: var(--row-hacker-news-w);
    --h: var(--row-hacker-news-h);
  }

  .tc {
    --c: var(--blue);
    --r: 1.5deg;
    --x: var(--row-techcrunch-x);
    --y: var(--row-techcrunch-y);
    --w: var(--row-techcrunch-w);
    --h: var(--row-techcrunch-h);
  }

  .ph {
    --c: var(--purple);
    --r: -1.5deg;
    --x: var(--row-product-hunt-x);
    --y: var(--row-product-hunt-y);
    --w: var(--row-product-hunt-w);
    --h: var(--row-product-hunt-h);
  }

  /* S5 (art): 2-D character at his computer on the right. */
  [data-layout="art"] .copy {
    width: 450px;
  }

  [data-layout="art"] h1 {
    font-size: 54px;
  }

  .scene {
    position: absolute;
    left: 548px;
    top: 38px;
    width: 700px;
    height: 724px;
  }
</style>
</head>
<body data-layout="{{LAYOUT}}" data-n="{{N}}">
  <div class="ground"></div>

  <!-- Confetti dots and plus signs from the style guide. -->
  <svg class="confetti" viewBox="0 0 1280 800" aria-hidden="true">
    <g stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M584 56v16M576 64h16" stroke="var(--purple)"/>
      <path d="M1236 196v16M1228 204h16" stroke="var(--orange)"/>
      <path d="M84 716v16M76 724h16" stroke="var(--blue)"/>
      <path d="M1190 738v14M1183 745h14" stroke="var(--teal)"/>
      <path d="M532 742v14M525 749h14" stroke="var(--pink)"/>
    </g>
    <circle cx="1234" cy="68" r="7" fill="var(--yellow)"/>
    <circle cx="1202" cy="98" r="4" fill="var(--pink)"/>
    <circle cx="68" cy="58" r="5" fill="var(--sky)"/>
    <circle cx="496" cy="96" r="5" fill="var(--teal)"/>
    <circle cx="1248" cy="488" r="5" fill="var(--purple)"/>
    <circle cx="348" cy="750" r="6" fill="var(--yellow)"/>
    <circle cx="886" cy="762" r="5" fill="var(--orange)"/>
    <circle cx="42" cy="426" r="4" fill="var(--pink)"/>
  </svg>

  <section class="copy">
    <div class="brand"><img src="{{ICON}}" alt=""><span>aiBytes<b>_</b></span></div>
    <h1>{{TITLE_HTML}}</h1>
    <p class="sub">{{SUBTITLE}}</p>
    <svg class="swoosh" viewBox="0 0 280 26" aria-hidden="true">
      <path d="M5 20C68 7 166 4 274 13" fill="none" stroke="var(--orange)" stroke-width="6.5" stroke-linecap="round"/>
    </svg>
  </section>

  <div class="pop"><img src="{{SHOT1}}" alt=""></div>

  <!-- S1: four sources feeding into the popup. -->
  <div class="only only-sources">
    <svg class="doodle" style="left:0;top:0" width="1280" height="800" viewBox="0 0 1280 800" aria-hidden="true">
      <g fill="none" stroke="var(--navy)" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 8">
        <path d="M640 166C674 176 686 208 708 236"/>
        <path d="M668 302C686 306 694 318 708 334"/>
        <path d="M662 438C684 438 694 426 708 414"/>
        <path d="M668 574C690 568 698 544 708 516"/>
      </g>
      <g fill="none" stroke="var(--orange)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M699 233l10 4-3-11"/>
        <path d="M698 332l11 3-4-10"/>
        <path d="M698 416l11-3-4 10"/>
        <path d="M699 520l10-5-2 11"/>
      </g>
    </svg>
    <div class="src" style="left:516px;top:140px;transform:rotate(-3deg)"><img src="/marks/github.svg" alt="">GitHub</div>
    <div class="src" style="left:502px;top:276px;transform:rotate(2.5deg)"><img src="/marks/hackernews.svg" alt="">Hacker News</div>
    <div class="src" style="left:510px;top:412px;transform:rotate(-2deg)"><img src="/marks/techcrunch.svg" alt="">TechCrunch</div>
    <div class="src" style="left:498px;top:548px;transform:rotate(3deg)"><img src="/marks/producthunt.svg" alt="">Product Hunt</div>
  </div>

  <!-- S2, S3: hand-drawn loop arrow pointing to the popup. -->
  <svg class="doodle only only-single" style="left:532px;top:86px" width="116" height="120" viewBox="0 0 116 120" aria-hidden="true">
    <g fill="none" stroke="var(--navy)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 100C14 58 42 32 66 52C82 66 60 84 52 66C44 46 72 26 102 24"/>
      <path d="M88 14l15 10-13 13"/>
    </g>
  </svg>

  <!-- S4: Hacker News, TechCrunch, Product Hunt rows ringed and labelled outside the UI. -->
  <div class="only only-annotated">
    <div class="ring hn"></div><div class="leader hn"></div><div class="tag hn">Hacker News threads</div>
    <div class="ring tc"></div><div class="leader tc"></div><div class="tag tc">AI news</div>
    <div class="ring ph"></div><div class="leader ph"></div><div class="tag ph">Product launches</div>
  </div>

  <!-- S5: 2-D character at his computer, monitor showing the three ways, winding road beneath. -->
  <svg class="scene only only-art" viewBox="0 0 700 724" aria-hidden="true">
    <defs>
      <style>
        .lbl { font: 700 18px 'Bricolage Grotesque', system-ui, sans-serif; fill: var(--navy); }
        .sublbl { font: 500 14px 'Inter', system-ui, sans-serif; fill: var(--ink-2); }
      </style>
    </defs>
    <g stroke="var(--navy)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <!-- Winding road motif -->
      <path d="M-10 698C130 638 270 698 430 648S650 618 720 656" fill="none" stroke="#363646" stroke-width="26"/>
      <path d="M-10 698C130 638 270 698 430 648S650 618 720 656" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="14 12"/>

      <!-- Desk -->
      <rect x="160" y="528" width="510" height="22" rx="7" fill="#e6c79c"/>
      <path d="M196 550v112M634 550v112" fill="none"/>

      <!-- Monitor -->
      <rect x="234" y="42" width="442" height="330" rx="22" fill="var(--navy)"/>
      <rect x="252" y="60" width="406" height="270" rx="10" fill="#ffffff" stroke="none"/>
      <path d="M435 372l-14 106h68l-14-106" fill="#c9cbd8"/>
      <rect x="385" y="476" width="140" height="18" rx="9" fill="#c9cbd8"/>

      <!-- Screen top bar -->
      <g stroke="none">
        <rect x="252" y="60" width="406" height="48" rx="10" fill="#f5f8fd"/>
        <rect x="252" y="96" width="406" height="12" fill="#f5f8fd"/>
        <path d="M276 72l-8 14h8l-3 12 11-16h-8l4-10z" fill="var(--blue)"/>
        <text x="294" y="93" class="lbl" style="font-size:20px">aiBytes<tspan fill="#3b82f6">_</tspan></text>
      </g>

      <!-- Three ways cards on screen -->
      <g>
        <rect x="270" y="124" width="118" height="188" rx="14" fill="#fff6ec" stroke="var(--orange)" stroke-width="3"/>
        <rect x="396" y="124" width="118" height="188" rx="14" fill="#eef4ff" stroke="var(--blue)" stroke-width="3"/>
        <rect x="522" y="124" width="118" height="188" rx="14" fill="#f4efff" stroke="var(--purple)" stroke-width="3"/>

        <!-- Globe: Daily feed -->
        <circle cx="329" cy="176" r="25" fill="#ffffff" stroke="var(--orange)" stroke-width="3"/>
        <path d="M304 176h50M329 151c-11 14-11 36 0 50M329 151c11 14 11 36 0 50" fill="none" stroke="var(--orange)" stroke-width="3"/>

        <!-- Puzzle: Extension -->
        <path d="M433 156h14a8 8 0 1 1 16 0h14v14a8 8 0 1 1 0 16v14h-44z" fill="#ffffff" stroke="var(--blue)" stroke-width="3"/>

        <!-- Envelope: Newsletter -->
        <rect x="557" y="158" width="48" height="36" rx="5" fill="#ffffff" stroke="var(--purple)" stroke-width="3"/>
        <path d="M559 162l22 18 22-18" fill="none" stroke="var(--purple)" stroke-width="3"/>
      </g>

      <g stroke="none">
        <text x="329" y="242" text-anchor="middle" class="lbl">Daily feed</text>
        <text x="329" y="266" text-anchor="middle" class="sublbl">aibytes.io</text>
        <text x="455" y="242" text-anchor="middle" class="lbl">Extension</text>
        <text x="455" y="266" text-anchor="middle" class="sublbl">In Chrome</text>
        <text x="581" y="242" text-anchor="middle" class="lbl">Newsletter</text>
        <text x="581" y="266" text-anchor="middle" class="sublbl">Every week</text>
      </g>

      <!-- Character: young man, glasses, curly dark hair, orange sweatshirt, blue trousers, orange shoes -->
      <g transform="translate(-44 8)">
        <!-- Chair -->
        <path d="M40 420h108v148H40z" fill="#c4a47a"/>
        <path d="M44 558v110M144 558v110" fill="none"/>

        <!-- Blue trousers & orange shoe -->
        <path d="M90 520h120v40h-30v120h-40V560H90z" fill="var(--blue)"/>
        <path d="M140 676h56a10 10 0 0 1 0 20h-60z" fill="var(--orange)"/>

        <!-- Orange sweatshirt & arm -->
        <path d="M70 380c0-60 40-96 90-96s84 38 84 96v150H70z" fill="var(--orange)"/>
        <path d="M200 380c30 30 70 70 120 120l-22 22c-50-40-100-80-120-110z" fill="var(--orange)"/>
        <circle cx="318" cy="512" r="16" fill="#f2c29b"/>

        <!-- Neck & head -->
        <path d="M150 276v24h40v-24" fill="#f2c29b"/>
        <circle cx="172" cy="214" r="62" fill="#f2c29b"/>

        <!-- Curly dark hair -->
        <g fill="#2b2b33">
          <circle cx="130" cy="180" r="24"/>
          <circle cx="152" cy="156" r="24"/>
          <circle cx="182" cy="150" r="24"/>
          <circle cx="210" cy="164" r="22"/>
          <circle cx="118" cy="212" r="20"/>
          <circle cx="126" cy="244" r="16"/>
        </g>

        <!-- Glasses -->
        <g fill="#ffffff" fill-opacity="0.55">
          <circle cx="200" cy="212" r="16"/>
          <circle cx="234" cy="212" r="14"/>
        </g>
        <path d="M216 212h4M184 210l-18-4" fill="none"/>

        <!-- Cheerful eyes & smile -->
        <circle cx="204" cy="212" r="3.5" fill="var(--navy)" stroke="none"/>
        <circle cx="236" cy="212" r="3.5" fill="var(--navy)" stroke="none"/>
        <path d="M196 244c12 10 26 8 34-2" fill="none"/>
      </g>
    </g>
  </svg>
</body>
</html>
