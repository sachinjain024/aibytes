<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="The latest in AI for developers: launches, repos, threads, and news in one daily edition." />
    <title>aiBytes_</title>
    <script>
      // The theme before first paint (see useTheme): the reader's pick, else light.
      var theme = "light";
      try {
        var stored = localStorage.getItem("aibytes-theme"); // prefs.js THEME
        if (stored === "light" || stored === "dark") theme = stored;
      } catch (e) {}
      document.documentElement.dataset.theme = theme;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
