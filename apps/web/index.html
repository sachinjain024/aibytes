<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="The latest in AI for developers: launches, repos, threads, and news in one daily edition." />
    <title>aiBytes_</title>
    <script>
      // The theme before first paint (see useTheme): the reader's pick, else light.
      var theme = "light";
      try {
        var stored = localStorage.getItem("aibytes-theme"); // prefs.js THEME
        if (stored === "light" || stored === "dark") theme = stored;
      } catch (e) {}
      document.documentElement.dataset.theme = theme;
    </script>
    <!-- Umami Cloud analytics: no cookies, nothing stored in the browser (AIB-145y,
         docs/specs/AIB-145y-gist-analytics.md). The website id is public by design.
         data-domains keeps dev servers and local builds from recording anything. -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="3bafe9de-d5cd-44f1-8e47-92a2083d53b2" data-domains="aibytes.io"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
