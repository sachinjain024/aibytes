<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>01 · Latest edition — grid · light</title>
<link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="app.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js?v=14"></script>
<script src="data.js"></script>
</head><body style="margin:0;background:var(--bg)">
<div id="root"></div>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="App.jsx"></script>
<script type="text/babel">
const App = window.AiBytesApp;
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "nav": "Side nav",
  "tagline": "today's AI, in one byte",
  "cardSignals": "Bottom row",
  "cardTags": "Dots"
}/*EDITMODE-END*/;
const NAV_MAP = { "Header chips": "header", "Side nav": "side" };
const SIG_MAP = { "Under logo": "logo", "Bottom row": "bottom", "Source row": "source", "Own row": "row" };
const TAG_MAP = { "Dots": "dots", "Pills": "pills", "Hashtags": "hash" };
function Root() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  return (
    <React.Fragment>
      <App nav={NAV_MAP[t.nav] || "header"} tagline={t.tagline} cardSignals={SIG_MAP[t.cardSignals] || "bottom"} cardTags={TAG_MAP[t.cardTags] || "dots"} />
      <TweaksPanel>
        <TweakSection label="Navigation" />
        <TweakRadio label="Categories" value={t.nav} options={["Header chips", "Side nav"]} onChange={v => setTweak("nav", v)} />
        <TweakText label="Tagline" value={t.tagline} onChange={v => setTweak("tagline", v)} />
        <TweakSection label="Card layout" />
        <TweakRadio label="Upvotes & comments" value={t.cardSignals} options={["Under logo", "Source row", "Bottom row", "Own row"]} onChange={v => setTweak("cardSignals", v)} />
        <TweakRadio label="Tag style" value={t.cardTags} options={["Dots", "Pills", "Hashtags"]} onChange={v => setTweak("cardTags", v)} />
      </TweaksPanel>
    </React.Fragment>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script></body></html>
