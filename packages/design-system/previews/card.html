<!-- @dsCard group="Surfaces" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>aib-card</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Instrument+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../dist/tokens.css">
<style>
  body { margin:0; padding:32px; background:var(--aib-surface); font-family:var(--aib-font-body); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
</style>
<script type="module" src="../components/aib-card.js"></script>
<script type="module" src="../components/aib-button.js"></script>
</head>
<body>
  <div class="grid">
    <aib-card eyebrow="Issue 07">
      <h3>OpenAI cuts off Cursor</h3>
      <p>The week's lead story, rendered in the card surface.</p>
    </aib-card>
    <aib-card notched eyebrow="Notched">
      <h3>Signature corner</h3>
      <p>The cut corner carried over from the issue thumbnail.</p>
      <aib-button size="sm" variant="ghost">Read →</aib-button>
    </aib-card>
  </div>
</body>
</html>
