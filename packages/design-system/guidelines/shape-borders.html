<!-- @dsCard group="Spacing" viewport="700x190" name="Shape — radii, borders, focus" subtitle="1px borders everywhere · no shadows at rest · hover swaps --border for --accent" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--bg);color:var(--text);font-family:var(--font-body)}
.lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-2);letter-spacing:.02em}
.row{display:flex;align-items:baseline;gap:14px}
.wrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}.demo{display:flex;flex-direction:column;gap:6px;align-items:center}</style></head><body><div class="wrap">
<div class="demo"><div style="width:110px;height:64px;background:var(--surface);border:1px solid var(--border);border-radius:10px"></div><span class="lbl">card · 10px</span></div>
<div class="demo"><div style="width:110px;height:64px;background:var(--surface);border:1px solid var(--accent);border-radius:10px;transform:translateY(-1px)"></div><span class="lbl">card hover · accent + lift</span></div>
<div class="demo"><div style="width:84px;height:28px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px"></div><span class="lbl">chip · 6px</span></div>
<div class="demo"><div style="width:40px;height:40px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px"></div><span class="lbl">image · 8px</span></div>
<div class="demo"><div style="width:84px;height:28px;background:var(--surface);border:1px solid var(--border);border-radius:6px;outline:2px solid var(--accent);outline-offset:2px"></div><span class="lbl">focus · 2px ring, 2px offset</span></div>
</div></body></html>
