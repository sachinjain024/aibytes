<!-- @dsCard group="Type" viewport="700x230" name="Scale — 13 / 14 / 16 / 20 / 28" subtitle="Five sizes plus 12 mono meta; roles are fixed" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--bg);color:var(--text);font-family:var(--font-body)}
.lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-2);letter-spacing:.02em}
.row{display:flex;align-items:baseline;gap:14px}
.grid{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;align-items:baseline}</style></head><body><div class="grid">
<span class="lbl">28</span><span style="font-family:var(--font-display);font-weight:800;font-size:28px;line-height:34px;letter-spacing:-0.02em">Page wordmark</span>
<span class="lbl">20</span><span style="font-family:var(--font-display);font-weight:700;font-size:20px;line-height:26px;letter-spacing:-0.02em">Section heading</span>
<span class="lbl">16</span><span style="font-size:16px;line-height:22px;font-weight:600">Card title</span>
<span class="lbl">14</span><span style="font-size:14px;line-height:20px">Summary and body</span>
<span class="lbl">13</span><span style="font-size:13px;line-height:18px">UI copy, chips, edition bar</span>
<span class="lbl">12</span><span class="lbl" style="font-size:12px;color:var(--text)">META, SIGNALS, TAGS — MONO ONLY</span>
</div></body></html>
