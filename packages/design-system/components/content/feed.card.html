<html><head><meta charset="utf-8">

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>body{margin:0;padding:10px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}

</head><body><div id="root"></div>
<script type="text/babel">
const { Card, ListRow, CardGrid, RowList, SectionHeading, EmptyState, EndCard, StatusMessage } = window.LedgerAiBytesDesignSystem_b1be4f;
const chatcut = { id:"ph-chatcut", title:"ChatCut", summary:"AI video editor inside ChatGPT with a real timeline and XML export.", url:"#", source:"producthunt", source_url:"#", tags:["Video","Dev Tool"], signals:{ upvotes:776, comments:42 } };
const officecli = { id:"gh-officecli", title:"OfficeCLI", summary:"Create and edit Word, Excel, and PowerPoint files from the command line.", url:"#", source:"github", source_url:"#", tags:["CLI","Open Source"], signals:{ stars_gained:6400, comments:0 }, meta:{ language:"Python" } };

const items = [chatcut, officecli, hn, tc];
const Feed = ({dark}) => (

  <Feed dark/>
